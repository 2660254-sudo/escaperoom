<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6학년 과학 학습 도우미 AI</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --soft-bg: #f9fafb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 800px;
      height: calc(100vh - 32px);
      max-height: 880px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 상단 헤더 */
    .header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #eff6ff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .header-title h1 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      color: #111827;
    }

    .header-title p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .reset-btn {
      background: var(--soft-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: #f3f4f6;
      color: var(--text);
    }

    /* 대화창 */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: #ffffff;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 90%;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      background: #eff6ff;
      border: 1px solid #dbeafe;
    }

    .msg-row.user .avatar {
      background: #f3f4f6;
      border-color: #e5e7eb;
    }

    .bubble {
      background: var(--soft-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.94rem;
      line-height: 1.6;
      color: var(--text);
    }

    .msg-row.user .bubble {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .bot-intro {
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* 개별 문장 + 따지기 버튼 */
    .claim-block {
      margin-top: 8px;
      padding: 10px 12px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }

    .claim-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .claim-text {
      flex: 1;
      font-size: 0.93rem;
      line-height: 1.55;
    }

    .argue-btn {
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid #d1d5db;
      color: #4b5563;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 2px;
    }

    .argue-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #eff6ff;
    }

    /* 인라인 따지기 입력창 */
    .argue-form {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #e5e7eb;
      display: flex;
      gap: 6px;
    }

    .argue-form input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    .argue-form input:focus {
      border-color: var(--primary);
    }

    .argue-form button {
      padding: 7px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .argue-submit {
      background: var(--primary);
      color: white;
    }

    .argue-cancel {
      background: #f3f4f6;
      color: #4b5563;
    }

    .quote-tag {
      font-size: 0.78rem;
      opacity: 0.85;
      margin-bottom: 4px;
      padding-left: 8px;
      border-left: 2px solid rgba(255, 255, 255, 0.6);
    }

    .typing {
      color: var(--muted);
      font-size: 0.88rem;
      font-style: italic;
    }

    /* 하단 질문 추천 & 입력창 */
    .controls {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 16px;
    }

    .topic-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .chip {
      background: var(--soft-bg);
      border: 1px solid var(--border);
      color: #374151;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: var(--primary);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
    }

    .input-row input:focus {
      border-color: var(--primary);
    }

    .input-row button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .input-row button:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-left">
      <div class="bot-logo">🔬</div>
      <div class="header-title">
        <h1>6학년 과학 학습 도우미 AI</h1>
        <p>교과서 핵심 개념 정리 및 질의응답</p>
      </div>
    </div>
    <button class="reset-btn" id="resetBtn" type="button">새 대화</button>
  </header>

  <main class="chat-box" id="chatBox"></main>

  <footer class="controls">
    <div class="topic-chips" id="topicChips"></div>
    <form class="input-row" id="chatForm">
      <input type="text" id="userInput" placeholder="궁금한 6학년 과학 내용을 입력해 보세요..." autocomplete="off" />
      <button type="submit">전송</button>
    </form>
  </footer>
</div>

<script>
  // 6학년 과학 주제 데이터 (isWrong은 내부 응답 처리용이며 UI에 절대 노출되지 않음)
  const TOPICS = [
    {
      id: "plants",
      label: "식물의 구조와 기능",
      keywords: ["식물", "광합성", "잎", "뿌리", "줄기", "증산", "감자", "고구마"],
      question: "식물의 뿌리, 줄기, 잎은 각각 어떤 일을 하나요?",
      intro: "초등 6학년 과학에서 다루는 식물의 구조와 기능에 대해 핵심만 정리해 드릴게요.",
      claims: [
        {
          text: "식물의 뿌리는 땅속의 물과 양분을 흡수하고, 식물이 쓰러지지 않게 단단히 지지하는 역할을 합니다.",
          isWrong: false,
          replyOnArgue: "말씀하신 내용도 생각할 수 있지만, 식물의 뿌리는 실제로 물·양분의 흡수와 식물체 지지, 그리고 일부 식물에서는 양분 저장 기능을 수행하는 것이 맞습니다."
        },
        {
          text: "식물의 잎에서는 주로 빛이 없는 밤에 물과 산소를 이용해 스스로 양분을 만드는 광합성이 활발하게 일어납니다.",
          isWrong: true,
          replyOnArgue: "아, 지적해 주셔서 감사합니다. 제가 앞뒤 내용을 혼동하여 잘못 설명했네요. 광합성은 빛이 있는 낮에 물과 '이산화탄소'를 이용해 양분과 산소를 만드는 과정입니다."
        },
        {
          text: "잎의 기공을 통해 물이 수증기 형태로 공기 중으로 빠져나가는 현상을 증산 작용이라고 합니다.",
          isWrong: false,
          replyOnArgue: "이 부분은 정확한 과학적 사실입니다. 증산 작용은 잎의 기공에서 일어나며, 뿌리에서 흡수한 물이 줄기를 타고 위로 올라오는 데 도움을 줍니다."
        },
        {
          text: "고구마와 감자는 모두 식물의 뿌리에 양분을 저장하는 대표적인 식물입니다.",
          isWrong: true,
          replyOnArgue: "좋은 지적입니다. 다시 확인해 보니 제가 잘못 안내했네요. 고구마는 '뿌리'에 양분을 저장하지만, 감자는 땅속의 '줄기'에 양분을 저장하는 식물입니다."
        }
      ]
    },
    {
      id: "earth",
      label: "지구·달과 계절 변화",
      keywords: ["지구", "달", "자전", "공전", "계절", "낮", "밤", "여름", "겨울"],
      question: "낮과 밤, 그리고 계절의 변화는 왜 생기나요?",
      intro: "지구와 달의 운동 및 계절 변화의 원리를 설명해 드릴게요.",
      claims: [
        {
          text: "지구가 하루에 한 바퀴씩 태양 주위를 공전하기 때문에 낮과 밤이 번갈아 나타납니다.",
          isWrong: true,
          replyOnArgue: "짚어주셔서 감사합니다. 제가 용어를 헷갈려 잘못 말씀드렸네요. 낮과 밤이 생기는 이유는 지구가 제자리에서 하루에 한 바퀴 도는 '자전' 때문이며, 태양 주위를 도는 공전은 1년이 걸립니다."
        },
        {
          text: "지구가 자전할 때 우리는 움직임을 느끼지 못하지만, 태양과 달은 동쪽에서 떠서 서쪽으로 움직이는 것처럼 보입니다.",
          isWrong: false,
          replyOnArgue: "이 설명은 맞습니다. 지구가 서쪽에서 동쪽으로 자전하기 때문에 지구에 있는 우리 눈에는 천체가 반대로 동쪽에서 서쪽으로 이동하는 것처럼 보입니다."
        },
        {
          text: "여름이 덥고 겨울이 추운 까닭은 지구가 타원 궤도를 돌면서 여름에 태양과 거리가 훨씬 가까워지기 때문입니다.",
          isWrong: true,
          replyOnArgue: "아, 날카로운 지적 감사합니다. 다시 확인해 보니 제가 잘못된 정보를 드렸네요. 계절이 변하는 진짜 원인은 태양과의 거리가 아니라 '지구의 자전축이 기울어진 채 공전'하면서 태양의 남중 고도와 낮의 길이가 달라지기 때문입니다."
        },
        {
          text: "달의 모양은 음력 기준 약 29.5일을 주기로 초승달, 상현달, 보름달, 하현달, 그믐달 순서로 변합니다.",
          isWrong: false,
          replyOnArgue: "해당 내용은 교과서에 나오는 정확한 사실입니다. 달이 지구 주위를 공전하면서 태양 빛을 반사하는 모습을 우리가 보는 각도가 매일 달라지기 때문입니다."
        }
      ]
    },
    {
      id: "gases",
      label: "여러 가지 기체",
      keywords: ["기체", "산소", "이산화탄소", "질소", "공기", "석회수"],
      question: "공기 속 산소와 이산화탄소는 어떤 성질이 있나요?",
      intro: "우리 주변 공기를 이루는 여러 가지 기체의 특징을 알려드릴게요.",
      claims: [
        {
          text: "우리가 숨 쉬는 공기에서 가장 많은 비율(약 78%)을 차지하는 기체는 산소이고, 그다음이 질소(약 21%)입니다.",
          isWrong: true,
          replyOnArgue: "말씀하신 대로 제가 비율을 반대로 설명했네요. 수정해 드리자면 공기 중 가장 많은 기체는 '질소(약 78%)'이고, '산소'는 약 21%를 차지합니다."
        },
        {
          text: "산소는 색깔과 냄새가 없으며, 다른 물질이 잘 타도록 돕는 성질이 있습니다.",
          isWrong: false,
          replyOnArgue: "이 부분은 정확한 사실입니다. 산소는 스스로 타지는 않지만 다른 물질이 타는 것을 돕기 때문에 꺼져가는 불씨를 넣으면 불꽃이 살아납니다."
        },
        {
          text: "이산화탄소는 공기보다 가벼워서 위로 떠오르며, 석회수와 만나면 석회수를 맑고 투명하게 만듭니다.",
          isWrong: true,
          replyOnArgue: "지적 감사합니다. 제가 반대로 말씀드렸군요. 이산화탄소는 공기보다 무거워 아래로 가라앉으며, 석회수와 만나면 '뿌옇게' 흐려지는 성질이 있습니다."
        },
        {
          text: "기체는 온도가 높아지면 부피가 커지고, 압력을 세게 가하면 부피가 줄어드는 성질이 있습니다.",
          isWrong: false,
          replyOnArgue: "맞는 설명입니다. 6학년 과학에서 배우는 기체의 온도와 압력에 따른 부피 변화의 기본 원리입니다."
        }
      ]
    },
    {
      id: "energy",
      label: "전기와 빛·렌즈",
      keywords: ["전기", "전구", "직렬", "병렬", "전자석", "자석", "빛", "렌즈", "볼록"],
      question: "전구의 연결 방법과 전자석, 볼록 렌즈의 특징을 알려주세요.",
      intro: "전기 회로와 전자석, 빛과 렌즈에 대해 정리해 드릴게요.",
      claims: [
        {
          text: "두 개의 전구를 병렬로 연결하면, 전구 하나가 끊어져도 나머지 전구에는 계속 불이 켜져 있습니다.",
          isWrong: false,
          replyOnArgue: "이 내용은 정확한 사실입니다. 병렬연결은 전류가 흐르는 길이 나누어져 있어 하나가 끊어져도 다른 쪽 길로 전류가 흐를 수 있습니다."
        },
        {
          text: "전자석은 전류가 끊어져도 자석의 성질이 계속 유지되며, 전류의 방향을 바꾸어도 N극과 S극이 변하지 않습니다.",
          isWrong: true,
          replyOnArgue: "좋은 지적입니다. 제가 일반 막대자석의 성질과 혼동했네요. 전자석은 '전류가 흐를 때만' 자석이 되며, 전류의 방향을 바꾸면 N극과 S극의 위치도 서로 바뀝니다."
        },
        {
          text: "전지를 직렬로 연결하면 전지 한 개를 연결했을 때보다 전구의 불빛이 더 밝아집니다.",
          isWrong: false,
          replyOnArgue: "정확한 설명입니다. 전지를 직렬로 연결하면 전류가 세져 전구가 더 밝게 빛납니다."
        },
        {
          text: "가운데가 볼록한 볼록 렌즈는 통과하는 빛을 사방으로 넓게 퍼지게 하는 성질이 있어서 돋보기에 사용됩니다.",
          isWrong: true,
          replyOnArgue: "아, 지적해 주셔서 감사합니다. 제가 볼록 렌즈와 오목 렌즈의 성질을 헷갈렸네요. 볼록 렌즈는 빛을 '한곳으로 모아주는' 성질이 있고, 빛을 퍼지게 하는 것은 오목 렌즈입니다."
        }
      ]
    }
  ];

  const chatBox = document.getElementById("chatBox");
  const topicChips = document.getElementById("topicChips");
  const chatForm = document.getElementById("chatForm");
  const userInput = document.getElementById("userInput");
  const resetBtn = document.getElementById("resetBtn");

  function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function renderChips() {
    topicChips.innerHTML = "";
    TOPICS.forEach(topic => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.textContent = topic.label;
      btn.onclick = () => handleTopicClick(topic);
      topicChips.appendChild(btn);
    });
  }

  function addWelcomeMessage() {
    chatBox.innerHTML = "";
    const row = document.createElement("div");
    row.className = "msg-row";
    row.innerHTML = `
      <div class="avatar">🔬</div>
      <div class="bubble">
        안녕하세요! <strong>6학년 과학 학습 도우미 AI</strong>입니다.<br>
        수업 시간과 관련된 과학 개념이나 궁금한 주제를 아래에서 선택하거나 직접 입력해 주세요.
        설명을 읽다가 의문이 들거나 다른 의견이 있는 문장은 옆의 <strong>[따지기]</strong> 버튼을 눌러 질문하실 수 있습니다.
      </div>
    `;
    chatBox.appendChild(row);
  }

  function addUserBubble(text, quotedText = null) {
    const row = document.createElement("div");
    row.className = "msg-row user";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "학생";
    avatar.style.fontSize = "0.72rem";
    avatar.style.fontWeight = "700";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (quotedText) {
      const quote = document.createElement("div");
      quote.className = "quote-tag";
      quote.textContent = `"${quotedText.length > 32 ? quotedText.slice(0, 32) + "..." : quotedText}"`;
      bubble.appendChild(quote);
    }

    const msgText = document.createElement("div");
    msgText.textContent = text;
    bubble.appendChild(msgText);

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    scrollToBottom();
  }

  function showTypingThen(callback) {
    const typingRow = document.createElement("div");
    typingRow.className = "msg-row";
    typingRow.innerHTML = `
      <div class="avatar">🔬</div>
      <div class="bubble typing">답변을 정리하고 있습니다...</div>
    `;
    chatBox.appendChild(typingRow);
    scrollToBottom();

    setTimeout(() => {
      typingRow.remove();
      callback();
    }, 550);
  }

  function addBotSimpleMessage(text) {
    const row = document.createElement("div");
    row.className = "msg-row";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "🔬";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    scrollToBottom();
  }

  function addBotTopicMessage(topic) {
    const row = document.createElement("div");
    row.className = "msg-row";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "🔬";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const intro = document.createElement("div");
    intro.className = "bot-intro";
    intro.textContent = topic.intro;
    bubble.appendChild(intro);

    topic.claims.forEach(claim => {
      const block = document.createElement("div");
      block.className = "claim-block";

      const claimRow = document.createElement("div");
      claimRow.className = "claim-row";

      const textEl = document.createElement("div");
      textEl.className = "claim-text";
      textEl.textContent = "• " + claim.text;

      const argueBtn = document.createElement("button");
      argueBtn.type = "button";
      argueBtn.className = "argue-btn";
      argueBtn.textContent = "따지기";
      argueBtn.onclick = () => toggleArgueForm(block, claim);

      claimRow.appendChild(textEl);
      claimRow.appendChild(argueBtn);
      block.appendChild(claimRow);
      bubble.appendChild(block);
    });

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatBox.appendChild(row);
    scrollToBottom();
  }

  function toggleArgueForm(block, claim) {
    const existing = block.querySelector(".argue-form");
    if (existing) {
      existing.remove();
      return;
    }

    const form = document.createElement("form");
    form.className = "argue-form";

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "이 내용에 대해 궁금하거나 다르게 생각하는 이유를 적어보세요";
    input.required = true;

    const submitBtn = document.createElement("button");
    submitBtn.type = "submit";
    submitBtn.className = "argue-submit";
    submitBtn.textContent = "보내기";

    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "argue-cancel";
    cancelBtn.textContent = "취소";
    cancelBtn.onclick = () => form.remove();

    form.onsubmit = (e) => {
      e.preventDefault();
      const userReason = input.value.trim();
      if (!userReason) return;
      form.remove();

      addUserBubble(userReason, claim.text);
      showTypingThen(() => {
        addBotSimpleMessage(claim.replyOnArgue);
      });
    };

    form.appendChild(input);
    form.appendChild(submitBtn);
    form.appendChild(cancelBtn);
    block.appendChild(form);
    input.focus();
  }

  function handleTopicClick(topic) {
    addUserBubble(topic.question);
    showTypingThen(() => addBotTopicMessage(topic));
  }

  chatForm.onsubmit = (e) => {
    e.preventDefault();
    const text = userInput.value.trim();
    if (!text) return;
    userInput.value = "";

    addUserBubble(text);
    const matched = TOPICS.find(t => t.keywords.some(k => text.includes(k)));

    showTypingThen(() => {
      if (matched) {
        addBotTopicMessage(matched);
      } else {
        addBotSimpleMessage(
          "지금 질문하신 내용은 오늘 수업 범위와 조금 다르거나 더 구체적인 키워드가 필요합니다. 아래 주제 버튼(식물, 지구·달, 기체, 전기와 빛) 중 하나를 선택해 질문해 보세요."
        );
      }
    });
  };

  resetBtn.onclick = () => {
    addWelcomeMessage();
  };

  renderChips();
  addWelcomeMessage();
</script>
</body>
</html>
